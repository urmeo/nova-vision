<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">NovaVision: app and experiment pipelines</title>
  <desc id="description">The app takes English text, a style, and an optional seed. A text classifier scores seven emotions; word values and label priors estimate valence and arousal. The leading label selects raw prompting for neutral or affect prompting otherwise. A local, hosted, or synthetic test backend returns an image and run details. Separately, experiments start with known labels, build four prompt tiers with shared seeds, generate images, probe them, and compare predictions with targets. No image probe feeds back into the app.</desc>
  <defs>
    <marker id="app-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="research-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1200" height="750" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="48" font-size="30" font-weight="700" fill="#0f172a">NovaVision pipeline</text>
    <text x="40" y="80" font-size="19" fill="#475569">Generate from text. Evaluate emotion recovery in separate experiments.</text>

    <text x="40" y="123" font-size="16" font-weight="700" fill="#6d28d9">WEB APP</text>
    <g fill="#fff" stroke="#ddd6fe" stroke-width="2">
      <rect x="40" y="142" width="242" height="225" rx="16"/>
      <rect x="333" y="142" width="242" height="225" rx="16"/>
      <rect x="626" y="142" width="242" height="225" rx="16"/>
      <rect x="919" y="142" width="241" height="225" rx="16"/>
    </g>
    <g fill="#7c3aed" font-size="16" font-weight="700">
      <text x="60" y="177">01</text><text x="353" y="177">02</text><text x="646" y="177">03</text><text x="939" y="177">04</text>
    </g>
    <g fill="#0f172a" font-size="25" font-weight="700">
      <text x="60" y="216">Input</text><text x="353" y="216">Analyze</text><text x="646" y="216">Build prompt</text><text x="939" y="216">Render</text>
    </g>
    <g fill="#475569" font-size="19">
      <text x="60" y="255">English text</text>
      <text x="60" y="284">Visual style</text>
      <text x="60" y="313">Optional seed</text>
      <text x="353" y="255">Seven emotion scores</text>
      <text x="353" y="284">Word values + priors</text>
      <text x="353" y="313">→ valence and arousal</text>
      <text x="646" y="255">Text + style + presets</text>
      <text x="646" y="284">Neutral → raw</text>
      <text x="646" y="313">Other labels → affect</text>
      <text x="939" y="255">Local diffusion or</text>
      <text x="939" y="284">hosted inference</text>
      <text x="939" y="325" font-size="17" fill="#6d28d9">Default: synthetic test</text>
    </g>
    <g fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#app-arrow)">
      <path d="M292 253H321"/><path d="M585 253H614"/><path d="M878 253H907"/>
    </g>
    <text x="40" y="401" font-size="18" fill="#475569">Output: image, prompt, text scores, affect estimates, seed, and backend.</text>

    <path d="M40 430H1160" stroke="#cbd5e1"/>
    <text x="40" y="469" font-size="16" font-weight="700" fill="#0f766e">SEPARATE EXPERIMENTS</text>
    <text x="40" y="499" font-size="19" fill="#475569">Start with known targets. Keep the seed shared across the four main tiers.</text>
    <g fill="#fff" stroke="#99d5cd" stroke-width="2">
      <rect x="40" y="523" width="200" height="153" rx="14"/>
      <rect x="270" y="523" width="200" height="153" rx="14"/>
      <rect x="500" y="523" width="200" height="153" rx="14"/>
      <rect x="730" y="523" width="200" height="153" rx="14"/>
      <rect x="960" y="523" width="200" height="153" rx="14"/>
    </g>
    <g fill="#0f172a" font-size="22" font-weight="700">
      <text x="57" y="562">Known targets</text><text x="287" y="562">Paired tiers</text><text x="517" y="562">Generate</text><text x="747" y="562">Image probe</text><text x="977" y="562">Compare</text>
    </g>
    <g fill="#475569" font-size="18">
      <text x="57" y="602">Subjects + labels</text><text x="57" y="631">or labelled text</text>
      <text x="287" y="602">raw · naive</text><text x="287" y="631">emotion · affect</text>
      <text x="517" y="602">Same model, style,</text><text x="517" y="631">and image settings</text>
      <text x="747" y="602">Recover a label</text><text x="747" y="631">Estimate affect</text>
      <text x="977" y="602">Recovery + affect</text><text x="977" y="631">Controls + records</text>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#research-arrow)">
      <path d="M245 599H263"/><path d="M475 599H493"/><path d="M705 599H723"/><path d="M935 599H953"/>
    </g>
    <text x="40" y="718" font-size="18" fill="#475569">Probe predictions are model estimates. They do not establish how a person feels about an image.</text>
  </g>
</svg>
