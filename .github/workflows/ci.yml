name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy
      - name: Ruff lint
        run: ruff check novavision tests scripts server.py
      - name: Ruff format check
        run: ruff format --check novavision tests scripts server.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Browser regressions
        run: node --test tests/test_web_ui.js
      - name: mypy
        run: mypy novavision

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov
      - name: Run tests with coverage
        run: pytest -q --cov=novavision --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-xml
          path: coverage.xml

  server-smoke:
    name: Server smoke (real socket, no models)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Boot the server and exercise the hardened surface
        run: bash scripts/smoke_server.sh

  ml-smoke:
    name: ML import + null-path smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ml + research deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,research]"
      - name: Import the real generation/eval stack
        run: |
          python -c "from novavision.generation.diffusers_backend import DiffusersBackend; \
                     from novavision.eval.probes import CLIPProbe; \
                     from novavision.affect.analyzer import EmotionAnalyzer; print('imports ok')"
      - name: Null-backend experiment smoke
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from novavision.eval.probes import Recovery
          from novavision.taxonomy import EMOTIONS
          import novavision.experiments.run as run

          class FakeProbe:
              name = "clip:ci"
              def __init__(self, *a, **k): pass
              def recover(self, image): return Recovery("joy", 0.1, 0.5, {e: 0.0 for e in EMOTIONS})
              def clip_t(self, image, text): return 0.2

          with patch.object(run, "CLIPProbe", FakeProbe):
              run.run_experiment(backend="null", contents=1, seeds=1, out="outputs/generated/ci")
          print("experiment smoke ok")
          PY

  security:
    name: Security audit (secrets + deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the project with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,ml,research,dev]" pip-audit
      - name: Audit the installed environment
        run: pip-audit --desc
