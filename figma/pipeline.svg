<text id="Figure purpose" fill="#ADBAC3" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="24" letter-spacing="0em"><tspan x="56" y="105.727">Text shapes the prompt. Separate experiments test the image.</tspan></text>
