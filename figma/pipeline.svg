<svg width="1440" height="1120" viewBox="0 0 1440 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>NovaVision signal flow</title>
<desc>Text analysis builds image prompts from emotion labels and word scores. Separate experiments require an explicit image-classifier checkpoint. Classifier valence and arousal are fixed label priors, not independent image measurements. Current classifier recovery has not been measured; human ratings are unavailable.</desc>
